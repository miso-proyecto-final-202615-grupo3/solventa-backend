replicaCount: 1
fullnameOverride: mock-kyc

containerName: backend-service
serviceAccountName: solventa-app-sa

image:
  repository: mock-kyc
  pullPolicy: IfNotPresent
  tag: "latest"

network:
  portName: http
  containerPort: 8000
  protocol: TCP

probes:
  readiness:
    path: /docs
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /docs
    port: http
    initialDelaySeconds: 20
    periodSeconds: 20

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

database:
  enabled: false

bucket:
  enabled: false

redis:
  enabled: false

cognito:
  enabled: false

kmsKey:
  enabled: false

config:
  PROJECT_NAME: Solventa Mock KYC
  VERSION: "0.1.0"
  ENVIRONMENT: dev
  MOCK_KYC_STATUS: PASSED

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
