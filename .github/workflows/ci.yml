name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity_service
          - quotingengine_service
          - bff_web
          - bff_mobile
          - mock_openfinance
          - mock_opendata

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ${{ matrix.service }}/requirements-dev.txt

      - name: Run tests (${{ matrix.service }})
        run: >
          python -m pytest ${{ matrix.service }}/tests
          --html=${{ matrix.service }}/test-results.html --self-contained-html
          --cov=${{ matrix.service }}/src
          --cov-report=html:${{ matrix.service }}/coverage-results

      - name: Upload test execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-report-${{ matrix.service }}
          path: ${{ matrix.service }}/test-results.html
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage-results/
          if-no-files-found: warn

  build:
    name: Docker Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity_service
          - quotingengine_service
          - bff_web
          - bff_mobile
          - mock_kyc
          - mock_openfinance
          - mock_opendata
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -f docker/services/Dockerfile.${{ matrix.service }} -t solventa/${{ matrix.service }} .
