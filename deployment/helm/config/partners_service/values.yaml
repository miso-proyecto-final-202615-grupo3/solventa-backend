replicaCount: 1
autoscaling:
  enabled: false
  cpuUtilization: 70
  min: 1
  max: 5
fullnameOverride: partners-service

containerName: partners-service
serviceAccountName: solventa-app-sa

image:
  repository: partners-service
  pullPolicy: Always
  tag: "latest"

http:
  containerPort: 8000
  servicePort: 80

probes:
  readiness:
    path: /health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /
    port: http
    initialDelaySeconds: 20
    periodSeconds: 20

database:
  enabled: true
  existingSecret: secret-name
  secretKey: DATABASE_URL

partners:
  enabled: true
  existingSecret: secret-name
  secretKey: PARTNERS_INTERNAL_TOKEN

config:
  PROJECT_NAME: solventa-partners-service
  VERSION: "0.1.0"
  ENVIRONMENT: dev
  API_PREFIX: /api/v1/partners-service
  OTEL_EXPORTER_OTLP_ENDPOINT: http://cloudwatch-agent.amazon-cloudwatch.svc.cluster.local:4315
  OTEL_TRACES_EXPORTER: otlp

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
