replicaCount: 1
fullnameOverride: bff-web

containerName: backend-service
serviceAccountName: solventa-app-sa

image:
  repository: bff-web
  pullPolicy: Always
  tag: "latest"

http:
  containerPort: 8000
  servicePort: 80

probes:
  readiness:
    path: /health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /
    port: http
    initialDelaySeconds: 20
    periodSeconds: 20

database:
  enabled: false

bucket:
  enabled: false

redis:
  enabled: false

cognito:
  enabled: false

kmsKey:
  enabled: false

config:
  PROJECT_NAME: solventa-bff-web
  VERSION: "0.1.0"
  ENVIRONMENT: dev
  API_PREFIX: /api/v1/bff-web
  OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
  OTEL_TRACES_EXPORTER: otlp
  IDENTITY_SERVICE_URL: http://identity-service:80
  QUOTINGENGINE_SERVICE_URL: http://quotingengine-service:80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
