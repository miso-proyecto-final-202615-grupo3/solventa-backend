replicaCount: 1
fullnameOverride: motor-cotizacion

containerName: backend-service
serviceAccountName: solventa-app-sa

image:
  repository: motor-cotizacion
  pullPolicy: Always
  tag: "latest"

network:
  portName: http
  containerPort: 8000
  protocol: TCP

probes:
  readiness:
    path: /health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /
    port: http
    initialDelaySeconds: 20
    periodSeconds: 20

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

database:
  enabled: false

bucket:
  enabled: false

cognito:
  enabled: false

redis:
  enabled: true
  existingSecret: secret-name
  secretKey: REDIS_ENDPOINT
  secretKey2: REDIS_AUTH_TOKEN

kmsKey:
  enabled: false

config:
  PROJECT_NAME: Solventa Motor de Cotización
  VERSION: "0.1.0"
  ENVIRONMENT: dev
  API_PREFIX: /api/v1/motor-cotizacion
  IDENTITY_GRPC_TARGET: identity-service:50051
  IDENTITY_GRPC_TIMEOUT_SECONDS: 0.3
  # Configurar el endpoint HTTPS del proveedor en el ambiente.
  OPEN_DATA_URL: ""
  OPEN_DATA_TIMEOUT_SECONDS: 0.25
  OPEN_DATA_CACHE_TTL_SECONDS: 300
  OTEL_EXPORTER_OTLP_ENDPOINT: http://solventa-otel-collector-collector:4317
  OTEL_TRACES_EXPORTER: otlp

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
