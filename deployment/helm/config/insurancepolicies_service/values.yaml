replicaCount: 1
fullnameOverride: insurancepolicies-service

containerName: backend-service
serviceAccountName: solventa-app-sa

image:
  repository: insurancepolicies-service
  pullPolicy: Always
  tag: "latest"

http:
  containerPort: 8000
  servicePort: 80

probes:
  readiness:
    path: /health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /
    port: http
    initialDelaySeconds: 20
    periodSeconds: 20

database:
  enabled: true
  existingSecret: secret-name
  secretKey: DATABASE_URL

bucket:
  enabled: false

cognito:
  enabled: false

redis:
  enabled: false

kmsKey:
  enabled: false

config:
  PROJECT_NAME: solventa-insurancepolicies-service
  VERSION: "0.1.0"
  ENVIRONMENT: dev
  API_PREFIX: /api/v1/insurancepolicies-service
  OTEL_EXPORTER_OTLP_ENDPOINT: http://cloudwatch-agent.amazon-cloudwatch.svc.cluster.local:4315
  OTEL_TRACES_EXPORTER: otlp

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
