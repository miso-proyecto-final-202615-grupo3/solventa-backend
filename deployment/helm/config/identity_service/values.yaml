replicaCount: 1
fullnameOverride: identity-service

containerName: backend-service
serviceAccountName: solventa-app-sa

image:
  repository: identity-service
  pullPolicy: Always
  tag: "latest"

network:
  portName: http
  containerPort: 8000
  protocol: TCP

extraContainerPorts:
  - name: grpc
    containerPort: 50051
    protocol: TCP

extraServicePorts:
  - name: grpc
    port: 50051
    targetPort: grpc
    protocol: TCP

probes:
  readiness:
    path: /health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /
    port: http
    initialDelaySeconds: 20
    periodSeconds: 20

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

database:
  enabled: true
  existingSecret: secret-name
  secretKey: DATABASE_URL

bucket:
  enabled: true
  existingSecret: secret-name
  secretKey: S3_BUCKET_NAME

cognito:
  enabled: true
  existingSecret: secret-name
  secretKey: COGNITO_USER_POOL_ID
  secretKey2: COGNITO_CLIENT_ID

redis:
  enabled: true
  existingSecret: secret-name
  secretKey: REDIS_ENDPOINT
  secretKey2: REDIS_AUTH_TOKEN

kmsKey:
  enabled: true
  existingSecret: secret-name
  secretKey: KMS_KEY_ARN

config:
  PROJECT_NAME: Solventa Identity Service
  VERSION: "0.1.0"
  ENVIRONMENT: dev
  API_PREFIX: /api/v1/identity-service
  OTEL_EXPORTER_OTLP_ENDPOINT: http://solventa-otel-collector-collector:4317
  OTEL_TRACES_EXPORTER: otlp
  AWS_REGION: us-east-1
  COGNITO_ENABLED: "true"
  CONSENT_TERMS_VERSION: "1.0"
  CONSENT_CACHE_TTL_SECONDS: 300
  OPEN_FINANCE_URL: ""
  OPEN_FINANCE_TIMEOUT_SECONDS: 0.2
  IDENTITY_GRPC_PORT: 50051
  KYC_SERVICE_URL: http://mock-kyc:80
  KYC_TIMEOUT_SECONDS: 0.7

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
