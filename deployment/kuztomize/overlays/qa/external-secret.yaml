apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: solventa-qa-app-externalsecret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager-store
    kind: SecretStore
  target:
    name: solventa-qa-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: qa/solventa-backend/app-secrets
        property: DATABASE_URL
    - secretKey: S3_BUCKET_NAME
      remoteRef:
        key: qa/solventa-backend/app-secrets
        property: S3_BUCKET_NAME
    - secretKey: COGNITO_CLIENT_ID
      remoteRef:
        key: qa/solventa-backend/app-secrets
        property: COGNITO_CLIENT_ID
    - secretKey: KMS_KEY_ARN
      remoteRef:
        key: qa/solventa-backend/app-secrets
        property: KMS_KEY_ARN
