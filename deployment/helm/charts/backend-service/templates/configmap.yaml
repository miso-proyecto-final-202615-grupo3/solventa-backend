apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend-service.fullname" . }}
  labels:
    {{- include "backend-service.labels" . | nindent 4 }}
data:
  PROJECT_NAME: {{ .Values.config.PROJECT_NAME | quote }}
  VERSION: {{ .Values.config.VERSION | quote }}
  ENVIRONMENT: {{ .Values.config.ENVIRONMENT | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}