# Override opcional para probar Cognito real en local (pool de dev).
# Monta ~/.aws en solo lectura para que los servicios usen el perfil AWS_PROFILE del .env.
# Uso: docker compose -f docker-compose.yml -f docker-compose.cognito.yml up -d identity_service bff_web partners_service
services:
  identity_service:
    environment:
      COGNITO_ENABLED: "true"
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
      AWS_PROFILE: Proy2-dev
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
    volumes:
      - ${USERPROFILE:-${HOME}}/.aws:/root/.aws:ro
  bff_web:
    environment:
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
      AWS_PROFILE: Proy2-dev
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
    volumes:
      - ${USERPROFILE:-${HOME}}/.aws:/root/.aws:ro
  partners_service:
    environment:
      COGNITO_ENABLED: "true"
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config
      AWS_PROFILE: Proy2-dev
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
    volumes:
      - ${USERPROFILE:-${HOME}}/.aws:/root/.aws:ro
