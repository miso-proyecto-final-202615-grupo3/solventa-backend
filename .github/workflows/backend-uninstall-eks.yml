name: backend-uninstall-eks

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Select the environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: "dev"

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-deploy-eks-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  backend-uninstall-eks:
    name: Uninstall ${{ matrix.service_name }} from ${{ inputs.target_env }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service_name:
          - bff_web
          - bff_mobile
          - identity_service
          - quotingengine_service
          - insurancepolicies_service
          - insuranceclaims_service
          - payments_service
          - liveness_adapter
          - mock_kyc
          - mock_opendata
          - mock_openfinance
          - mock_paymentprovider
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      SERVICE_NAME: ${{ matrix.service_name }}
      CLUSTER_NAME: solventa-${{ inputs.target_env }}-eks
      K8S_NAMESPACE: solventa-${{ inputs.target_env }}

    steps:
      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure EKS access
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Uninstall backend chart
        run: |
          service_release="${SERVICE_NAME//_/-}"
          helm uninstall "$service_release" \
            --namespace "$K8S_NAMESPACE" \
            --ignore-not-found \
            --wait
