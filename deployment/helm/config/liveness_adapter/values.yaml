replicaCount: 1
fullnameOverride: liveness-adapter

containerName: backend-service
serviceAccountName: solventa-app-sa

image:
  repository: liveness-adapter
  pullPolicy: Always
  tag: "latest"

http:
  containerPort: 8000
  servicePort: 80

probes:
  readiness:
    path: /api/v1/liveness-adapter/health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /api/v1/liveness-adapter/health
    port: http
    initialDelaySeconds: 20
    periodSeconds: 20

database:
  enabled: false
bucket:
  enabled: false
cognito:
  enabled: false
redis:
  enabled: true
kmsKey:
  enabled: false

config:
  PROJECT_NAME: Solventa Liveness Adapter
  ENVIRONMENT: dev
  LIVENESS_PROVIDER: propio
  LIVENESS_SESSION_TTL_SECONDS: "120"
  MAX_FRAME_BYTES: "524288"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 768Mi
