apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend-service.fullname" . }}
  labels:
    {{- include "backend-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "backend-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backend-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: {{ .Values.containerName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.http.containerPort }}
              protocol: TCP
            {{- if and .Values.grpc .Values.grpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.grpc.containerPort }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "backend-service.fullname" . }}
{{ if or .Values.database.enabled .Values.sqs.enabled .Values.bucket.enabled .Values.cognito.enabled .Values.redis.enabled .Values.kmsKey.enabled (and (hasKey .Values "livenessAdapter") .Values.livenessAdapter.enabled) }}
          env:
{{ if .Values.database.enabled }}
            - name: {{ .Values.database.secretKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
{{ end }}
{{ if and .Values.sqs .Values.sqs.enabled }}
{{- range .Values.sqs.secretKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.sqs.existingSecret }}
                  key: {{ . }}
{{- end }}
{{ end }}
{{ if .Values.bucket.enabled }}
            - name: {{ .Values.bucket.secretKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bucket.existingSecret }}
                  key: {{ .Values.bucket.secretKey }}
{{ end }}
{{ if .Values.cognito.enabled }}
{{- range .Values.cognito.secretKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.cognito.existingSecret }}
                  key: {{ . }}
{{- end }}
{{ end }}
{{ if .Values.redis.enabled }}
{{- range .Values.redis.secretKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.redis.existingSecret }}
                  key: {{ . }}
{{- end }}
{{ end }}
{{ if .Values.kmsKey.enabled }}
            - name: {{ .Values.kmsKey.secretKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kmsKey.existingSecret }}
                  key: {{ .Values.kmsKey.secretKey }}
{{- end }}
{{- if hasKey .Values "livenessAdapter" }}
{{- if .Values.livenessAdapter.enabled }}
{{- range .Values.livenessAdapter.secretKeys }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.livenessAdapter.existingSecret }}
                  key: {{ .secretKey }}
                  optional: {{ .optional | default false }}
{{- end }}
{{- end }}
{{- end }}
{{ end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
