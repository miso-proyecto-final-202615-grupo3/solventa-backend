services:
  identity_service:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.identity_service
    container_name: solventa-identity-service
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      PROJECT_NAME: Solventa Identity Service
      ENVIRONMENT: dev
      DATABASE_URL: ${DATABASE_URL:-}
      AWS_REGION: ${AWS_REGION:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      COGNITO_ENABLED: ${COGNITO_ENABLED:-}
      REDIS_ENDPOINT: ${REDIS_ENDPOINT:-}
      REDIS_AUTH_TOKEN: ${REDIS_AUTH_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      KYC_SERVICE_URL: ${KYC_SERVICE_URL:-http://mock_kyc:8000}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_SDK_LOAD_CONFIG: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      lgtm:
        condition: service_started

  quotingengine_service:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.quotingengine_service
    container_name: solventa-quotingengine-service
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      PROJECT_NAME: Solventa Quoting Engine Service
      ENVIRONMENT: dev
      DATABASE_URL: ${DATABASE_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    depends_on:
      db:
        condition: service_healthy
      lgtm:
        condition: service_started

  mock_kyc:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.mock_kyc
    container_name: solventa-mock-kyc
    ports:
      - "8202:8000"
    env_file:
      - .env
    environment:
      MOCK_KYC_STATUS: ${MOCK_KYC_STATUS:-PASSED}

  bff_web:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.bff_web
    container_name: solventa-bff-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PROJECT_NAME: Solventa BFF Web
      ENVIRONMENT: development
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity_service:8000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    depends_on:
      identity_service:
        condition: service_started
      lgtm:
        condition: service_started

  bff_mobile:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.bff_mobile
    container_name: solventa-bff-mobile
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      PROJECT_NAME: Solventa BFF Mobile
      ENVIRONMENT: development
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity_service:8000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    depends_on:
      identity_service:
        condition: service_started
      lgtm:
        condition: service_started

  db:
    image: postgres:16-alpine
    container_name: solventa-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdata}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_USER:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdata"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: solventa-redis
    environment:
      REDIS_AUTH_TOKEN: ${REDIS_AUTH_TOKEN:-}
    command:
      - sh
      - -c
      - 'if [ -n "$${REDIS_AUTH_TOKEN}" ]; then exec redis-server --requirepass "$${REDIS_AUTH_TOKEN}"; else exec redis-server; fi'
    healthcheck:
      test:
        - CMD-SHELL
        - 'if [ -n "$${REDIS_AUTH_TOKEN}" ]; then redis-cli -a "$${REDIS_AUTH_TOKEN}" ping; else redis-cli ping; fi'
      interval: 5s
      timeout: 3s
      retries: 5

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: solventa-lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
      - "9090:9090"
      - "3200:3200"
      - "3100:3100"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - lgtm_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  lgtm_data:
