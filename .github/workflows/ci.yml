name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity_service, bff_web, bff_mobile]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ${{ matrix.service }}/requirements-dev.txt

      - name: Run tests (${{ matrix.service }})
        run: python -m pytest ${{ matrix.service }}/tests

  build:
    name: Docker Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity_service, bff_web, bff_mobile, mock_kyc]
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -f docker/services/Dockerfile.${{ matrix.service }} -t solventa/${{ matrix.service }} .
