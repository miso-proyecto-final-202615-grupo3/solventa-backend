apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend-service.fullname" . }}
  labels:
    {{- include "backend-service.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.http.servicePort }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if and .Values.grpc .Values.grpc.enabled }}
    - port: {{ .Values.grpc.servicePort | default .Values.grpc.containerPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    {{- end }}
  selector:
    {{- include "backend-service.selectorLabels" . | nindent 4 }}
