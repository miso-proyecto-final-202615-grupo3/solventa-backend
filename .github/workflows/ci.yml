name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity_service, bff_web]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ${{ matrix.service }}/requirements-dev.txt

      - name: Run tests (${{ matrix.service }})
        run: python -m pytest ${{ matrix.service }}/tests

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build identity_service image
        run: docker build -f docker/services/Dockerfile.identity_service -t solventa/identity-service .

      - name: Build bff_web image
        run: docker build -f docker/services/Dockerfile.bff_web -t solventa/bff-web .

      - name: Build mock_kyc image
        run: docker build -f docker/services/Dockerfile.mock_kyc -t solventa/mock-kyc .
