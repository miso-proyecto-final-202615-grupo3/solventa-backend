apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: solventa-dev-app-externalsecret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager-store
    kind: SecretStore
  target:
    name: solventa-dev-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: DATABASE_URL
    - secretKey: S3_BUCKET_NAME
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: S3_BUCKET_NAME
    - secretKey: COGNITO_USER_POOL_ID
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: COGNITO_USER_POOL_ID
    - secretKey: COGNITO_CLIENT_ID
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: COGNITO_CLIENT_ID
    - secretKey: KMS_KEY_ARN
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: KMS_KEY_ARN
    - secretKey: REDIS_ENDPOINT
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: REDIS_ENDPOINT
    - secretKey: REDIS_AUTH_TOKEN
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: REDIS_AUTH_TOKEN
    - secretKey: LIVENESS_ADMIN_TOKEN
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: LIVENESS_ADMIN_TOKEN
    - secretKey: DIDIT_API_KEY
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: DIDIT_API_KEY
    - secretKey: PAGO_APROBADO_QUEUE_URL
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: PAGO_APROBADO_QUEUE_URL
    - secretKey: POLIZA_EMITIDA_QUEUE_URL
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: POLIZA_EMITIDA_QUEUE_URL
    - secretKey: TRAZABILIDAD_INTERNAL_TOKEN
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: TRAZABILIDAD_INTERNAL_TOKEN
    - secretKey: SOCIOS_API_KEY_ENCRYPTION_KEY
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: SOCIOS_API_KEY_ENCRYPTION_KEY
    - secretKey: SNS_PLATFORM_APPLICATION_ARN
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: SNS_PLATFORM_APPLICATION_ARN
    - secretKey: INSURANCECLAIMS_OPERADOR_TOKEN
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: INSURANCECLAIMS_OPERADOR_TOKEN
    - secretKey: INSURANCECLAIMS_EVENTOS_FUENTE_TOKEN
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: INSURANCECLAIMS_EVENTOS_FUENTE_TOKEN
    - secretKey: EVENTOS_PARAMETRICOS_QUEUE_URL
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: EVENTOS_PARAMETRICOS_QUEUE_URL
    - secretKey: EVENTOS_PARAMETRICOS_DLQ_URL
      remoteRef:
        key: dev/solventa-backend/app-secrets
        property: EVENTOS_PARAMETRICOS_DLQ_URL
