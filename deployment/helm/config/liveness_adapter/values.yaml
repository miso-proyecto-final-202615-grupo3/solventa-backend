replicaCount: 1
fullnameOverride: liveness-adapter

containerName: liveness-adapter
serviceAccountName: solventa-app-sa

image:
  repository: liveness-adapter
  pullPolicy: Always
  tag: "latest"

http:
  containerPort: 8000
  servicePort: 80

probes:
  readiness:
    path: /ready
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /health
    port: http
    initialDelaySeconds: 20
    periodSeconds: 20

database:
  enabled: false

sqs:
  enabled: false

bucket:
  enabled: false

cognito:
  enabled: false

redis:
  enabled: true
  existingSecret: secret-name
  secretKeys:
    - REDIS_ENDPOINT
    - REDIS_AUTH_TOKEN

kmsKey:
  enabled: false

livenessAdapter:
  enabled: true
  existingSecret: secret-name
  secretKeys:
    - name: ADMIN_TOKEN
      secretKey: LIVENESS_ADMIN_TOKEN
    - name: DIDIT_API_KEY
      secretKey: DIDIT_API_KEY
      optional: true

config:
  PROJECT_NAME: solventa-liveness-adapter
  ENVIRONMENT: dev
  LIVENESS_PROVIDER: propio
  LIVENESS_SESSION_TTL_SECONDS: "120"
  MAX_FRAME_BYTES: "524288"
  DIDIT_ENABLED: "false"
  DIDIT_BASE_URL: http://mock-kyc:80
  DIDIT_MAX_SESIONES_DIA: "5"
  DIDIT_MAX_SESIONES_MES: "100"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 768Mi
