replicaCount: 1
fullnameOverride: liveness-adapter

containerName: backend-service
serviceAccountName: solventa-app-sa

image:
  repository: liveness-adapter
  pullPolicy: Always
  tag: "latest"

http:
  containerPort: 8000
  servicePort: 80

probes:
  readiness:
    path: /api/v1/liveness-adapter/ready
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /api/v1/liveness-adapter/health
    port: http
    initialDelaySeconds: 20
    periodSeconds: 20

database:
  enabled: false
bucket:
  enabled: false
cognito:
  enabled: false
redis:
  enabled: true
  existingSecret: secret-name
  secretKey: REDIS_ENDPOINT
  secretKey2: REDIS_AUTH_TOKEN
kmsKey:
  enabled: false

# Secretos propios del adaptador (Secrets Manager → secret de Kubernetes de cada ambiente).
# DIDIT_API_KEY es opcional: solo se usa con DIDIT_ENABLED=true (demostración).
extraSecretEnv:
  - name: ADMIN_TOKEN
    existingSecret: secret-name
    secretKey: LIVENESS_ADMIN_TOKEN
  - name: DIDIT_API_KEY
    existingSecret: secret-name
    secretKey: DIDIT_API_KEY
    optional: true

config:
  PROJECT_NAME: Solventa Liveness Adapter
  ENVIRONMENT: dev
  LIVENESS_PROVIDER: propio
  LIVENESS_SESSION_TTL_SECONDS: "120"
  MAX_FRAME_BYTES: "524288"
  DIDIT_ENABLED: "false"
  DIDIT_BASE_URL: http://mock-kyc:80
  DIDIT_MAX_SESIONES_DIA: "5"
  DIDIT_MAX_SESIONES_MES: "100"

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 768Mi
