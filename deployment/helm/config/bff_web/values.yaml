replicaCount: 1
autoscaling:
  enabled: true
  cpuUtilization: 70
  min: 1
  max: 10
fullnameOverride: bff-web

containerName: bff-web
serviceAccountName: solventa-app-sa

image:
  repository: bff-web
  pullPolicy: Always
  tag: "latest"

http:
  containerPort: 8000
  servicePort: 80

probes:
  readiness:
    path: /health
    port: http
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /
    port: http
    initialDelaySeconds: 20
    periodSeconds: 20

database:
  enabled: false

sqs:
  enabled: false

bucket:
  enabled: false

redis:
  enabled: false

cognito:
  enabled: true
  existingSecret: secret-name
  secretKeys:
    - COGNITO_USER_POOL_ID
    - COGNITO_CLIENT_ID

audit:
  enabled: true
  existingSecret: secret-name
  secretKey: TRAZABILIDAD_INTERNAL_TOKEN

partners:
  enabled: true
  existingSecret: secret-name
  secretKey: PARTNERS_INTERNAL_TOKEN

kmsKey:
  enabled: false

config:
  PROJECT_NAME: solventa-bff-web
  VERSION: "0.1.0"
  ENVIRONMENT: dev
  API_PREFIX: /api/v1/bff-web
  OTEL_EXPORTER_OTLP_ENDPOINT: http://cloudwatch-agent.amazon-cloudwatch.svc.cluster.local:4315
  OTEL_TRACES_EXPORTER: otlp
  IDENTITY_SERVICE_URL: http://identity-service:80
  QUOTINGENGINE_SERVICE_URL: http://quotingengine-service:80
  INSURANCEPOLICIES_SERVICE_URL: http://insurancepolicies-service:80
  PAYMENTS_SERVICE_URL: http://payments-service:80
  PARTNERS_SERVICE_URL: http://partners-service:80
  FIRMA_MAX_REQUEST_BYTES: "2097152"
  COGNITO_REGION: us-east-1
  COGNITO_AUDITOR_GROUP: Auditor
  COGNITO_SOCIOS_ADMIN_GROUP: SociosAdmin
  COGNITO_JWKS_TTL_SECONDS: 3600

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
