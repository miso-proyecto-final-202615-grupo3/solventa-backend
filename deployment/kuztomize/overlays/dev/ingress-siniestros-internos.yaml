# HU4.2.2 / HU4.2.3 · Solo dev: publica en el ALB compartido los endpoints internos de MS Siniestros que se usan para
# demostrar las notificaciones (cambio de estado por operador) y el siniestro paramétrico (ingesta de eventos).
# Cada ruta exige su token (X-Operador-Token / X-Fuente-Token, secretos en dev/solventa-backend/app-secrets).
# El resto de MS Siniestros sigue sin publicarse. Rutas con comodín: pathType ImplementationSpecific del ALB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solventa-ingress-siniestros-internos
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: solventa-shared-alb-group
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/group.order: "5"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: "8000"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/v1/insuranceclaims-service/siniestros/*/estado
            pathType: ImplementationSpecific
            backend:
              service:
                name: insuranceclaims-service
                port:
                  number: 80
          - path: /api/v1/insuranceclaims-service/eventos-parametricos*
            pathType: ImplementationSpecific
            backend:
              service:
                name: insuranceclaims-service
                port:
                  number: 80
          - path: /api/v1/insuranceclaims-service/polizas-parametricas/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: insuranceclaims-service
                port:
                  number: 80
