name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - bff_web
          - bff_mobile
          - identity_service
          - quotingengine_service
          - insurancepolicies_service
          - insuranceclaims_service
          - payments_service
          - liveness_adapter
          - mock_kyc
          - mock_opendata
          - mock_openfinance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ${{ matrix.service }}/requirements-dev.txt

      - name: Run tests (${{ matrix.service }})
        run: >
          python -m pytest ${{ matrix.service }}/tests
          --html=${{ matrix.service }}/test-results.html --self-contained-html
          --cov=${{ matrix.service }}/src
          --cov-report=html:${{ matrix.service }}/coverage-results

      - name: Upload test execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-report-${{ matrix.service }}
          path: ${{ matrix.service }}/test-results.html
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage-results/
          if-no-files-found: warn

  test-claims-postgres:
    name: Test insuranceclaims_service PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: claims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d claims_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: insuranceclaims_service/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r insuranceclaims_service/requirements-dev.txt
      - name: Run PostgreSQL integration test
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/claims_test
          OTEL_SDK_DISABLED: "true"
        run: python -m pytest insuranceclaims_service/tests/integration/test_postgres.py -c insuranceclaims_service/pytest.ini

  test-payments-postgres:
    name: Test payments_service PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payments_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: payments_service/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r payments_service/requirements-dev.txt
      - name: Run PostgreSQL integration test
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/payments_test
          OTEL_SDK_DISABLED: "true"
        run: python -m pytest payments_service/tests/integration/test_postgres.py -c payments_service/pytest.ini

  build:
    name: Docker Build ${{ matrix.service }}
    needs: [test, test-claims-postgres, test-payments-postgres]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - bff_web
          - bff_mobile
          - identity_service
          - quotingengine_service
          - insurancepolicies_service
          - insuranceclaims_service
          - payments_service
          - mock_kyc
          - mock_opendata
          - mock_openfinance
          - liveness_adapter

    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -f docker/services/Dockerfile.${{ matrix.service }} -t solventa/${{ matrix.service }} .
