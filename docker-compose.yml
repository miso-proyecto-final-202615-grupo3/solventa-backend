services:
  identity_service:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.identity_service
    container_name: solventa-identity-service
    ports:
      - "8002:8000"
      - "50051:50051"
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/identity_db}"
      AWS_REGION: ${AWS_REGION:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      COGNITO_ENABLED: "${COGNITO_ENABLED:-true}"
      REDIS_ENDPOINT: "${REDIS_ENDPOINT:-redis://redis:6379/0}"
      REDIS_AUTH_TOKEN: ${REDIS_AUTH_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      KYC_SERVICE_URL: ${KYC_SERVICE_URL:-http://mock_kyc:8000}
      KYC_TIMEOUT_SECONDS: ${KYC_TIMEOUT_SECONDS:-5.0}
      KYC_DOCUMENT_STORAGE: ${KYC_DOCUMENT_STORAGE:-s3}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      KMS_KEY_ARN: ${KMS_KEY_ARN:-}
      LIVENESS_ADAPTER_URL: ${LIVENESS_ADAPTER_URL:-http://liveness_adapter:8000}
      OPEN_FINANCE_URL: ${OPEN_FINANCE_URL:-http://mock_openfinance:8000}
      OPEN_FINANCE_TIMEOUT_SECONDS: ${OPEN_FINANCE_TIMEOUT_SECONDS:-0.2}
      GRPC_ENABLED: ${GRPC_ENABLED:-true}
      GRPC_PORT: ${GRPC_PORT:-50051}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      liveness_adapter:
        condition: service_started
      mock_openfinance:
        condition: service_started
      lgtm:
        condition: service_started

  partners_service:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.partners_service
    container_name: solventa-partners-service
    ports:
      - "8007:8000"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/identity_db}"
      PARTNERS_INTERNAL_TOKEN: ${PARTNERS_INTERNAL_TOKEN:-local-partners-token}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_SOCIO_GROUP: ${COGNITO_SOCIO_GROUP:-Socio}
      COGNITO_ENABLED: "${COGNITO_ENABLED:-true}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    depends_on:
      db:
        condition: service_healthy
      lgtm:
        condition: service_started

  liveness_adapter:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.liveness_adapter
    container_name: solventa-liveness-adapter
    ports:
      - "8203:8000"
    environment:
      ENVIRONMENT: development
      REDIS_ENDPOINT: ${LIVENESS_REDIS_ENDPOINT:-redis://redis:6379/1}
      REDIS_AUTH_TOKEN: ${REDIS_AUTH_TOKEN:-}
      LIVENESS_PROVIDER: ${LIVENESS_PROVIDER:-propio}
      ADMIN_TOKEN: ${LIVENESS_ADMIN_TOKEN:-}
      DIDIT_ENABLED: ${DIDIT_ENABLED:-false}
      DIDIT_BASE_URL: ${DIDIT_BASE_URL:-http://mock_kyc:8000}
      DIDIT_API_KEY: ${DIDIT_API_KEY:-mock}
      DIDIT_WORKFLOW_ID: ${DIDIT_WORKFLOW_ID:-00000000-0000-0000-0000-000000000000}
      DIDIT_MAX_SESIONES_DIA: ${DIDIT_MAX_SESIONES_DIA:-5}
      DIDIT_MAX_SESIONES_MES: ${DIDIT_MAX_SESIONES_MES:-100}
    depends_on:
      redis:
        condition: service_healthy
      mock_kyc:
        condition: service_started

  quotingengine_service:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.quotingengine_service
    container_name: solventa-quotingengine-service
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/identity_db}
      REDIS_ENDPOINT: ${REDIS_ENDPOINT:-redis://redis:6379/0}
      REDIS_AUTH_TOKEN: ${REDIS_AUTH_TOKEN:-}
      IDENTITY_GRPC_ADDRESS: ${IDENTITY_GRPC_ADDRESS:-identity_service:50051}
      OPEN_DATA_URL: ${OPEN_DATA_URL:-http://mock_opendata:8000}
      OPEN_DATA_TIMEOUT_SECONDS: ${OPEN_DATA_TIMEOUT_SECONDS:-0.25}
      OPEN_DATA_CACHE_TTL_SECONDS: ${OPEN_DATA_CACHE_TTL_SECONDS:-300}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity_service:
        condition: service_started
      mock_opendata:
        condition: service_started
      lgtm:
        condition: service_started

  insurancepolicies_service:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.insurancepolicies_service
    container_name: solventa-insurancepolicies-service
    ports:
      - "8004:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/identity_db}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      FIRMA_STORAGE: ${FIRMA_STORAGE:-s3}
      CERTIFICADO_STORAGE: ${CERTIFICADO_STORAGE:-s3}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      QUOTINGENGINE_SERVICE_URL: ${QUOTINGENGINE_SERVICE_URL:-http://quotingengine_service:8000}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity_service:8000}
      # SQS remoto por defecto (AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY salen de .env). Sin URL de
      # cola, el proceso correspondiente no se inicia. Para LocalStack, ver .env.example.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-}
      PAGO_APROBADO_QUEUE_URL: ${PAGO_APROBADO_QUEUE_URL:-}
      POLIZA_EMITIDA_QUEUE_URL: ${POLIZA_EMITIDA_QUEUE_URL:-}
    depends_on:
      db:
        condition: service_healthy
      lgtm:
        condition: service_started
      # localstack:
      #   condition: service_started

  insuranceclaims_service:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.insuranceclaims_service
    container_name: solventa-insuranceclaims-service
    ports:
      - "8005:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/identity_db}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      # HU4.1.1: pólizas reales de MS Pólizas (#265) y nombres de producto del Motor de Cotización.
      # POLIZAS_ADAPTER=memoria usa pólizas ficticias (demos sin MS Pólizas).
      POLIZAS_ADAPTER: ${POLIZAS_ADAPTER:-http}
      INSURANCEPOLICIES_SERVICE_URL: ${INSURANCEPOLICIES_SERVICE_URL:-http://insurancepolicies_service:8000}
      QUOTINGENGINE_SERVICE_URL: ${QUOTINGENGINE_SERVICE_URL:-http://quotingengine_service:8000}
      # HU4.1.2: evidencias en MinIO (S3 local). La app sube a S3_PUBLIC_ENDPOINT_URL:
      # 10.0.2.2 desde el emulador; con teléfono físico, la IP del PC o `adb reverse tcp:9000 tcp:9000` + localhost.
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://10.0.2.2:9000}
      S3_BUCKET_NAME: ${MINIO_BUCKET:-solventa-local-storage}
      EVIDENCIAS_SSE: AES256
      # Credenciales de MinIO, solo locales (sobrescriben las de AWS del .env para este servicio).
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-solventa}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-solventa-local-minio}
      # Sin perfil: el .env puede traer AWS_PROFILE para Cognito y ese perfil no existe en el contenedor.
      AWS_PROFILE: ""
    depends_on:
      db:
        condition: service_healthy
      lgtm:
        condition: service_started
      minio:
        condition: service_healthy

  payments_service:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.payments_service
    container_name: solventa-payments-service
    ports:
      - "8006:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/identity_db}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
      QUOTINGENGINE_SERVICE_URL: ${QUOTINGENGINE_SERVICE_URL:-http://quotingengine_service:8000}
      INSURANCEPOLICIES_SERVICE_URL: ${INSURANCEPOLICIES_SERVICE_URL:-http://insurancepolicies_service:8000}
      PAYMENT_PROVIDER_URL: ${PAYMENT_PROVIDER_URL:-http://mock_paymentprovider:8000}
      REQUIRE_FIRMA_DIGITAL: ${REQUIRE_FIRMA_DIGITAL:-true}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:-}
      PAGO_APROBADO_QUEUE_URL: ${PAGO_APROBADO_QUEUE_URL:-}
    depends_on:
      db:
        condition: service_healthy
      lgtm:
        condition: service_started
      mock_paymentprovider:
        condition: service_started
      # localstack:
      #   condition: service_started

  mock_paymentprovider:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.mock_paymentprovider
    container_name: solventa-mock-paymentprovider
    ports:
      - "8204:8000"

  # LocalStack: solo para probar SQS en local (PagoAprobado y PolizaEmitida). Por defecto se usa el
  # SQS remoto. Para activarlo, descomenta este servicio y los `depends_on` de payments_service e
  # insurancepolicies_service, y apunta las variables SQS a LocalStack como indica .env.example.
  # localstack:
  #   image: localstack/localstack:latest
  #   container_name: solventa-localstack
  #   ports:
  #     - "4566:4566"
  #   environment:
  #     SERVICES: sqs
  #     # Desde marzo de 2026 la imagen `latest` exige un token de cuenta de LocalStack.
  #     LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
  #   volumes:
  #     - ./scripts/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health >/dev/null"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 15s

  mock_kyc:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.mock_kyc
    container_name: solventa-mock-kyc
    ports:
      - "8202:8000"
    env_file:
      - .env
    environment:
      MOCK_KYC_STATUS: ${MOCK_KYC_STATUS:-PASSED}
      MOCK_AML_STATUS: ${MOCK_AML_STATUS:-PASSED}
      MOCK_DIDIT_STATUS: ${MOCK_DIDIT_STATUS:-Approved}

  mock_openfinance:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.mock_openfinance
    container_name: solventa-mock-openfinance
    ports:
      - "8200:8000"
    environment:
      MOCK_OPENFINANCE_STATUS: ${MOCK_OPENFINANCE_STATUS:-AVAILABLE}
      MOCK_OPENFINANCE_DELAY_MS: ${MOCK_OPENFINANCE_DELAY_MS:-0}
      MOCK_OPENFINANCE_INCOME: ${MOCK_OPENFINANCE_INCOME:-8500000}
      MOCK_OPENFINANCE_SAVINGS: ${MOCK_OPENFINANCE_SAVINGS:-25500000}
      MOCK_OPENFINANCE_DTI: ${MOCK_OPENFINANCE_DTI:-28}
      MOCK_OPENFINANCE_OVERDRAFTS: ${MOCK_OPENFINANCE_OVERDRAFTS:-0}
      MOCK_OPENFINANCE_SCORE: ${MOCK_OPENFINANCE_SCORE:-820}

  mock_opendata:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.mock_opendata
    container_name: solventa-mock-opendata
    ports:
      - "8201:8000"
    environment:
      MOCK_OPENDATA_STATUS: ${MOCK_OPENDATA_STATUS:-AVAILABLE}
      MOCK_OPENDATA_DELAY_MS: ${MOCK_OPENDATA_DELAY_MS:-0}
      MOCK_OPENDATA_CATEGORY: ${MOCK_OPENDATA_CATEGORY:-}

  bff_web:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.bff_web
    container_name: solventa-bff-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity_service:8000}
      QUOTINGENGINE_SERVICE_URL: ${QUOTINGENGINE_SERVICE_URL:-http://quotingengine_service:8000}
      INSURANCEPOLICIES_SERVICE_URL: ${INSURANCEPOLICIES_SERVICE_URL:-http://insurancepolicies_service:8000}
      PAYMENTS_SERVICE_URL: ${PAYMENTS_SERVICE_URL:-http://payments_service:8000}
      PARTNERS_SERVICE_URL: ${PARTNERS_SERVICE_URL:-http://partners_service:8000}
      PARTNERS_INTERNAL_TOKEN: ${PARTNERS_INTERNAL_TOKEN:-local-partners-token}
      COGNITO_REGION: ${COGNITO_REGION:-${AWS_REGION:-us-east-1}}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    depends_on:
      identity_service:
        condition: service_started
      quotingengine_service:
        condition: service_started
      insurancepolicies_service:
        condition: service_started
      payments_service:
        condition: service_started
      partners_service:
        condition: service_started

  bff_mobile:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.bff_mobile
    container_name: solventa-bff-mobile
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      # El bypass de demostración solo se permite en development.
      ENVIRONMENT: ${BFF_MOBILE_ENVIRONMENT:-development}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity_service:8000}
      ALLOW_DEMO_ACTIVATION_WITHOUT_JWT: ${ALLOW_DEMO_ACTIVATION_WITHOUT_JWT:-false}
      # Mismo pool y app client que identity_service: el token que emite Identity es el que valida el BFF.
      COGNITO_REGION: ${COGNITO_REGION:-${AWS_REGION:-us-east-1}}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      QUOTINGENGINE_SERVICE_URL: ${QUOTINGENGINE_SERVICE_URL:-http://quotingengine_service:8000}
      INSURANCECLAIMS_SERVICE_URL: ${INSURANCECLAIMS_SERVICE_URL:-http://insuranceclaims_service:8000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4317
    depends_on:
      identity_service:
        condition: service_started
      quotingengine_service:
        condition: service_started
      insuranceclaims_service:
        condition: service_started

  db:
    image: postgres:16-alpine
    container_name: solventa-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-identity_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-identity_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: solventa-redis
    environment:
      REDIS_AUTH_TOKEN: ${REDIS_AUTH_TOKEN:-}
    command:
      - sh
      - -c
      - 'if [ -n "$${REDIS_AUTH_TOKEN}" ]; then exec redis-server --requirepass "$${REDIS_AUTH_TOKEN}"; else exec redis-server; fi'
    healthcheck:
      test:
        - CMD-SHELL
        - 'if [ -n "$${REDIS_AUTH_TOKEN}" ]; then redis-cli -a "$${REDIS_AUTH_TOKEN}" ping; else redis-cli ping; fi'
      interval: 5s
      timeout: 3s
      retries: 5

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: solventa-lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
      - "9090:9090"
      - "3200:3200"
      - "3100:3100"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - lgtm_data:/data
    restart: unless-stopped

  # S3 local para las evidencias de siniestros (HU4.1.2). La imagen oficial de MinIO dejó de publicarse en
  # Docker Hub; esta es la última de Bitnami (sin mantenimiento): solo para desarrollo local.
  minio:
    image: bitnamilegacy/minio:2025.4.22
    container_name: solventa-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-solventa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-solventa-local-minio}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-solventa-local-storage}
      # Llave local para SSE-S3 (sin valor fuera de este contenedor; en AWS se usa KMS).
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-solventa-local:4z4XtHbZV/gcfb/KQ1SSESUEABlx4s+f9TtFfkhAnls=}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  lgtm_data:
  minio_data:
